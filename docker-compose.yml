services:

  postgres:
    image: postgres:16
    container_name: ops-agent-postgres

    environment:
      POSTGRES_USER: ops_user 
      POSTGRES_PASSWORD: ops_password
      POSTGRES_DB: ops_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ops-agent-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: